name: BLISS Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  EXPO_NO_DOCTOR: '1'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build BLISS release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BLISS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: BLISS/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m" --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bliss-release-apk-${{ github.sha }}
          path: BLISS/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
